# Konfigurasi DI DALAM image Nginx Admin PULEN (container port 80).
# HTTPS/TLS ditangani oleh Nginx host server, bukan di dalam container ini.
server {
    listen 80;
    server_name admin-perpus.payakumbuhkota.go.id localhost _;
    root /usr/share/nginx/html;
    index index.html;
    client_max_body_size 25m;

    location /api/ {
        proxy_pass http://pulen_backend:3000;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $http_x_forwarded_proto;
        proxy_connect_timeout 10s;
        proxy_read_timeout 120s;
    }

    # Semua request uploads tetap melalui backend untuk pemeriksaan akses.
    # JANGAN gunakan alias filesystem publik untuk PDF yang dilindungi.
    location /uploads/ {
        proxy_pass http://pulen_backend:3000;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $http_x_forwarded_proto;
    }

    location = /health {
        proxy_pass http://pulen_backend:3000;
    }

    location / {
        try_files $uri $uri/ /index.html;
    }
}
